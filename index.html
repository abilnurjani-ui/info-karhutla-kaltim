<!-- Firebase Web SDK v10 -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
  import { getFirestore, collection, query, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

  // Konfigurasi Firebase Web
  const firebaseConfig = {
    apiKey: "AIzaSyD8Thtpv8Xe94ydJOhtL8hwZJTPL7QFkh4",
    authDomain: "karhutla-kaltim.firebaseapp.com",
    projectId: "karhutla-kaltim",
    storageBucket: "karhutla-kaltim.firebasestorage.app",
    messagingSenderId: "1091307502135",
    appId: "1:1091307502135:web:bbd5f702831deb4a059db2"
  };

  // Inisialisasi Firebase & Firestore
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // Fungsi untuk mengambil data Karhutla terbaru
  async function loadKarhutlaData() {
    try {
      // Mengambil 1 dokumen terbaru dari koleksi 'history'
      const q = query(collection(db, "history"), orderBy("__name__", "desc"), limit(1));
      const querySnapshot = await getDocs(q);
      
      querySnapshot.forEach((doc) => {
        const data = doc.data();
        console.log("Data Firebase Terkoneksi:", data);

        // Contoh menghubungkan data ke elemen HTML (sesuaikan ID elemen Anda):
        // if (document.getElementById("last-update")) {
        //   document.getElementById("last-update").innerText = data.last_updated;
        // }
      });
    } catch (error) {
      console.error("Gagal mengambil data dari Firebase:", error);
    }
  }

  // Jalankan fungsi saat halaman dibuka
  loadKarhutlaData();
</script>
