name: Auto Update

on:
  schedule:
    # 00:17 UTC = 08:17 WITA (Pagi)
    # 12:34 UTC = 20:34 WITA (Malam)
    - cron: '17 0 * * *'
    - cron: '34 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install requests beautifulsoup4 urllib3
          pip install google-auth google-cloud-firestore
          pip install google-generativeai

      - name: Run Script Scraper with Gemini AI
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "GitHub Automation"
          git config --global user.email "actions@github.com"
          git add data_karhutla.json
          git commit -m "Auto-update data karhutla with AI Analysis: $(date +'%Y-%m-%d %H:%M:%S') [skip ci]" || exit 0
          git push
