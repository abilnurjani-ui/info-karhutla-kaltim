name: Auto Update Data Karhutla

on:
  schedule:
    # 00:00 UTC = 08:00 WITA (Pagi)
    # 12:00 UTC = 20:00 WITA (Malam)
    - cron: '0 0,12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 urllib3 google-cloud-firestore google-auth

      - name: Run Script Scraper
        run: python main.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "GitHub Automation"
          git config --global user.email "actions@github.com"
          git add data_karhutla.json
          git commit -m "Auto-update data karhutla & time-series log [skip ci]" || exit 0
          git push
