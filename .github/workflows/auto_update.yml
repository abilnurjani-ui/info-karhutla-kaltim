name: Auto Update Data Karhutla

on:
  schedule:
    # Menggunakan menit acak (17 & 34) untuk menghindari penundaan jam sibuk (peak-hour delay) GitHub
    # 23:57 UTC = 07:57 WITA (Pagi)
    # 11:34 UTC = 19:34 WITA (Malam)
    - cron: '57 23 * * *'
    - cron: '34 11 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 urllib3 google-cloud-firestore google-auth

      - name: Run Script Scraper
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python main.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "GitHub Automation"
          git config --global user.email "actions@github.com"
          git add data_karhutla.json
          git commit -m "Auto-update data karhutla: $(date +'%Y-%m-%d %H:%M:%S') [skip ci]" || exit 0
          git push
